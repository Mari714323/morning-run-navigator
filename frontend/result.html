<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算結果 - 朝の最適ランニング・ウォーキング計画ナビ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="content-container header-flex">
            <div>
                <h1 class="header-title"><span>🏃</span> 朝の最適ランニング・ウォーキング計画ナビ</h1>
                <p class="header-sub">もう、毎朝「走るかどうか」で悩まない</p>
            </div>
            <div class="header-actions">
                <a href="logic.html" class="btn-nav">💡 ロジックの解説を見る</a>
                <a href="index.html" class="btn-back"><span>←</span> 条件を設定し直す</a>
            </div>
        </div>
    </header>

    <div class="main-wrapper">
        <div class="content-container">

            <div id="status-message" class="loading-box">
                <span class="loading-flex">
                    <svg class="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle opacity="0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path opacity="0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    メモリから条件を復元し、最適なスケジュールを算出中...
                </span>
            </div>

            <main id="result-section" class="hidden">
                
                <div class="meta-badge-area">
                    分析対象地域: <span id="display-pref" class="badge-pref">Loading...</span>
                </div>

                <section class="section-card">
                    <h2 class="section-title"><span>✨</span> 今週のベストスケジュール</h2>
                    <div id="card-container" class="card-grid"></div>

                    <h3 class="section-title" style="margin-top: 3rem;"><span>📊</span> ひと目でわかる！今週の快適度グラフ</h3>
                    <div class="chart-container">
                        <canvas id="comfort-chart"></canvas>
                    </div>
                </section>

                <section class="section-card">
                    <h2 class="section-title"><span>📅</span> 7日間の快適度詳細一覧</h2>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="padding-left: 0.5rem;">日付</th>
                                    <th>快適度</th>
                                    <th>降水確率</th>
                                    <th>最大風速</th>
                                    <th>平均体感</th>
                                </tr>
                            </thead>
                            <tbody id="details-table-body">
                            </tbody>
                        </table>
                    </div>
                </section>
                
            </main>

        </div>
    </div>

    <script src="result.js"></script>
</body>
</html>
